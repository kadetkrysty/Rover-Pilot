name: RoverOS MiniPC server release

on:
  push:
    branches: [main]
    tags: ["roveros-server-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roveros-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Ubuntu amd64 server bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: write
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roveros_ci
          POSTGRES_PASSWORD: ci-only-not-a-deployment-password
          POSTGRES_DB: roveros_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roveros_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Normalize package URLs for GitHub runners
        run: node scripts/normalize-github-npm-lock.mjs

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed; retrying after clearing npm's download cache (attempt $attempt of 3)."
              npm cache clean --force
              sleep $((attempt * 10))
            fi
          done
          echo "::error::npm ci failed after three attempts."
          exit 1

      - name: Check TypeScript and client connection tests
        run: |
          npm run check
          npm run test:client-connection
          npm run test:desktop
          npm run test:provisioning
          bash -n scripts/minipc/*.sh

      - name: Build production server and web assets
        run: npm run build

      - name: Verify database migrations apply and can be rerun
        env:
          DATABASE_URL: postgresql://roveros_ci:ci-only-not-a-deployment-password@127.0.0.1:5432/roveros_ci
        run: |
          node dist/migrate.cjs
          node dist/migrate.cjs

      - name: Assemble prebuilt Linux server bundle
        run: npm run package:server

      - name: Test extracted server without Node dependencies
        run: npm run test:server-bundle

      - name: Attest server bundle provenance
        if: startsWith(github.ref, 'refs/tags/roveros-server-v')
        id: attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: generated-artifacts/server-release/RoverOS-server-linux-x64.tar.gz

      - name: Include signed provenance bundle
        if: startsWith(github.ref, 'refs/tags/roveros-server-v')
        env:
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" generated-artifacts/server-release/RoverOS-server-linux-x64.intoto.jsonl

      - name: Upload server bundle
        uses: actions/upload-artifact@v7
        with:
          name: roveros-server-linux-x64
          path: |
            generated-artifacts/server-release/RoverOS-server-linux-x64.tar.gz
            generated-artifacts/server-release/RoverOS-server-linux-x64.tar.gz.sha256
            generated-artifacts/server-release/RoverOS-server-linux-x64.intoto.jsonl
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach bundle to GitHub Release
    if: startsWith(github.ref, 'refs/tags/roveros-server-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download server bundle
        uses: actions/download-artifact@v7
        with:
          name: roveros-server-linux-x64

      - name: Create release if needed and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes --latest=false
          fi
          gh release upload "$RELEASE_TAG" \
            RoverOS-server-linux-x64.tar.gz \
            RoverOS-server-linux-x64.tar.gz.sha256 \
            RoverOS-server-linux-x64.intoto.jsonl \
            --clobber
