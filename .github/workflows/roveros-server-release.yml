name: RoverOS MiniPC server release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roveros-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Ubuntu amd64 server bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed; retrying after clearing npm's download cache (attempt $attempt of 3)."
              npm cache clean --force
              sleep $((attempt * 10))
            fi
          done
          echo "::error::npm ci failed after three attempts."
          exit 1

      - name: Check TypeScript and client connection tests
        run: |
          npm run check
          npm run test:client-connection
          npm run test:desktop

      - name: Build production server and web assets
        run: npm run build

      - name: Keep runtime dependencies only
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Assemble prebuilt Linux server bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          cp -a dist node_modules package.json migrations scripts/minipc/migrate.cjs deploy/avahi/roveros.service release-bundle/
          tar -C release-bundle -czf RoverOS-server-linux-x64.tar.gz .
          sha256sum RoverOS-server-linux-x64.tar.gz > RoverOS-server-linux-x64.tar.gz.sha256

      - name: Attest server bundle provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: RoverOS-server-linux-x64.tar.gz

      - name: Upload server bundle
        uses: actions/upload-artifact@v7
        with:
          name: roveros-server-linux-x64
          path: |
            RoverOS-server-linux-x64.tar.gz
            RoverOS-server-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach bundle to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download server bundle
        uses: actions/download-artifact@v7
        with:
          name: roveros-server-linux-x64

      - name: Create release if needed and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            RoverOS-server-linux-x64.tar.gz \
            RoverOS-server-linux-x64.tar.gz.sha256 \
            --clobber
