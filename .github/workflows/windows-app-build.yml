name: Windows desktop app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use public npm registry URLs in lockfile
        run: node scripts/normalize-github-npm-lock.mjs

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed; retrying after clearing npm's download cache (attempt $attempt of 3)."
              npm cache clean --force
              sleep $((attempt * 10))
            fi
          done
          echo "::error::npm ci failed after three attempts."
          exit 1

      - name: Test desktop address validation
        run: npm run test:desktop

      - name: Build RoverOS web app
        run: npm run build

      - name: Package Windows installer
        run: npm run desktop:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: roveros-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
