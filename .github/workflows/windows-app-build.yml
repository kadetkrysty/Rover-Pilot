name: Windows desktop app

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: Build a production installer with trusted code signing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use public npm registry URLs in lockfile
        run: node scripts/normalize-github-npm-lock.mjs

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed; retrying after clearing npm's download cache (attempt $attempt of 3)."
              npm cache clean --force
              sleep $((attempt * 10))
            fi
          done
          echo "::error::npm ci failed after three attempts."
          exit 1

      - name: Test desktop address validation
        run: npm run test:desktop

      - name: Build RoverOS web app
        run: npm run build

      - name: Require Windows code-signing certificate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw "Add WIN_CSC_LINK to GitHub Actions secrets as a base64-encoded trusted code-signing PFX certificate."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "Add WIN_CSC_KEY_PASSWORD to GitHub Actions secrets as the PFX password."
          }

      - name: Package signed Windows installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run desktop:win

      - name: Verify signed app and installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        shell: pwsh
        run: |
          $appExecutable = "release/win-unpacked/RoverOS.exe"
          if (-not (Test-Path -LiteralPath $appExecutable)) {
            throw "Packaged RoverOS.exe was not found at $appExecutable."
          }

          $installers = @(Get-ChildItem -Path "release" -Filter "RoverOS-Setup-*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one RoverOS setup installer; found $($installers.Count)."
          }

          $filesToVerify = @((Get-Item -LiteralPath $appExecutable)) + $installers
          foreach ($file in $filesToVerify) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Authenticode validation failed for $($file.Name): $($signature.Status) $($signature.StatusMessage)"
            }
            if (-not $signature.SignerCertificate) {
              throw "No signing certificate was found on $($file.Name)."
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "No trusted timestamp was found on $($file.Name)."
            }

            Write-Host "Verified $($file.Name) signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Upload signed Windows installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        uses: actions/upload-artifact@v7
        with:
          name: roveros-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Package unsigned test installer
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_signed_release) }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:win -- --config desktop/electron-builder.test.cjs

      - name: Verify and label unsigned test package
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_signed_release) }}
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "release/win-unpacked/RoverOS Test.exe")) {
            throw "Packaged RoverOS Test.exe was not found."
          }
          $installers = @(Get-ChildItem -Path "release" -Filter "RoverOS-Test-UNSIGNED-*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one clearly labelled unsigned test installer."
          }
          @"
          UNSIGNED TEST BUILD — NOT A SIGNED PRODUCTION RELEASE
          This installer has no trusted code signature and may show Windows security warnings.
          Do not disable antivirus or firewall protection to install it.
          It uses a separate RoverOS Test app identity and user-data directory.
          For production, run this workflow with build_signed_release enabled and configure trusted signing.
          "@ | Set-Content -LiteralPath "release/UNSIGNED-TEST-BUILD.txt" -Encoding utf8

      - name: Upload unsigned Windows test installer
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_signed_release) }}
        uses: actions/upload-artifact@v7
        with:
          name: roveros-windows-unsigned-test
          path: |
            release/RoverOS-Test-UNSIGNED-*.exe
            release/UNSIGNED-TEST-BUILD.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload CSS-derived installer theme resources
        uses: actions/upload-artifact@v7
        with:
          name: roveros-windows-installer-theme
          path: generated-artifacts/installer-theme/
          if-no-files-found: error
          retention-days: 14
