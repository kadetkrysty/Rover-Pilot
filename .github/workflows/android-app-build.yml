name: Android app build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build and upload a signed release APK
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: roveros-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Android release signing key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is not configured."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/roveros-release.keystore"
          test -s "$RUNNER_TEMP/roveros-release.keystore"

      - name: Build signed Android release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/roveros-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          version_code=$((ANDROID_RELEASE_RUN_NUMBER + 1))
          ./gradlew --no-daemon assembleRelease \
            -PandroidVersionCode="$version_code" \
            -PandroidVersionName="1.0.${ANDROID_RELEASE_RUN_NUMBER}"

      - name: Verify Android release APK signature
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Android release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        uses: actions/upload-artifact@v7
        with:
          name: roveros-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Android signing key
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.build_release }}
        run: rm -f "$RUNNER_TEMP/roveros-release.keystore"

  publish-release:
    name: Publish signed APK for testers
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified Android release APK
        uses: actions/download-artifact@v7
        with:
          name: roveros-android-release
          path: android-release

      - name: Publish signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="roveros-android-v1.0.${GH_RUN_NUMBER}"
          version="1.0.${GH_RUN_NUMBER}"
          apk="RoverOS-Android-v${version}.apk"
          cp android-release/app-release.apk "$apk"

          release_url="${GH_SERVER_URL}/${GH_REPOSITORY}/releases/latest"
          gh release create "$tag" "$apk" \
            --title "RoverOS Android Tester Release v${version}" \
            --notes "Signed Android APK for testers. Download the APK from Assets below. Stable download page: ${release_url}" \
            --latest \
            --target "$GH_SHA"

          printf '## RoverOS Android tester release\n\nDownload the latest signed release: [GitHub Releases](%s)\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
