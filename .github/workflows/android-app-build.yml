name: Android app build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build and upload a signed release APK
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Use public npm registry URLs in lockfile
        run: node scripts/normalize-github-npm-lock.mjs

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed; retrying after clearing npm's download cache (attempt $attempt of 3)."
              npm cache clean --force
              sleep $((attempt * 10))
            fi
          done
          echo "::error::npm ci failed after three attempts."
          exit 1

      - name: Test bundled fonts and license notices
        run: node --test client/src/assets/fonts/fonts.test.mjs

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: roveros-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check Android release version is newer than published releases
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ANDROID_RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          latest_release_run=0
          release_tags=$(gh api --paginate "repos/${GH_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^roveros-android-v1\.0\.([0-9]+)$ ]]; then
              release_run=${BASH_REMATCH[1]}
              if (( release_run > latest_release_run )); then
                latest_release_run=$release_run
              fi
            fi
          done <<< "$release_tags"

          if (( ANDROID_RELEASE_RUN_NUMBER <= latest_release_run )); then
            echo "::error::This workflow run would create Android version 1.0.${ANDROID_RELEASE_RUN_NUMBER}, which is not newer than the latest published Android release 1.0.${latest_release_run}. Start a new workflow run to create an installable update."
            exit 1
          fi

      - name: Prepare Android release signing key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is not configured."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/roveros-release.keystore"
          test -s "$RUNNER_TEMP/roveros-release.keystore"

      - name: Build signed predecessor and release APKs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/roveros-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          predecessor_version_code=$ANDROID_RELEASE_RUN_NUMBER
          predecessor_version_name="1.0.$((ANDROID_RELEASE_RUN_NUMBER - 1))"
          release_version_code=$((ANDROID_RELEASE_RUN_NUMBER + 1))
          release_version_name="1.0.${ANDROID_RELEASE_RUN_NUMBER}"

          ./gradlew --no-daemon clean assembleRelease \
            -PandroidVersionCode="$predecessor_version_code" \
            -PandroidVersionName="$predecessor_version_name"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/roveros-release-predecessor.apk"

          ./gradlew --no-daemon clean assembleRelease \
            -PandroidVersionCode="$release_version_code" \
            -PandroidVersionName="$release_version_name"
          cp "$RUNNER_TEMP/roveros-release-predecessor.apk" \
            app/build/outputs/apk/release/app-release-predecessor.apk

      - name: Verify release APK identity, versions, and signatures
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        env:
          ANDROID_RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          predecessor_apk="$RUNNER_TEMP/roveros-release-predecessor.apk"
          release_apk="android/app/build/outputs/apk/release/app-release.apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$apksigner" verify --verbose "$predecessor_apk"
          "$apksigner" verify --verbose "$release_apk"

          predecessor_identity=$("$aapt" dump badging "$predecessor_apk" |
            sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2 \3/p")
          release_identity=$("$aapt" dump badging "$release_apk" |
            sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2 \3/p")
          expected_predecessor_code=$ANDROID_RELEASE_RUN_NUMBER
          expected_release_code=$((ANDROID_RELEASE_RUN_NUMBER + 1))

          test "$predecessor_identity" = "com.roverostech.rover $expected_predecessor_code 1.0.$((ANDROID_RELEASE_RUN_NUMBER - 1))"
          test "$release_identity" = "com.roverostech.rover $expected_release_code 1.0.${ANDROID_RELEASE_RUN_NUMBER}"

          predecessor_certificate=$("$apksigner" verify --print-certs "$predecessor_apk" |
            sed -n 's/.*Signer #1 certificate SHA-256 digest: //p')
          release_certificate=$("$apksigner" verify --print-certs "$release_apk" |
            sed -n 's/.*Signer #1 certificate SHA-256 digest: //p')
          test -n "$predecessor_certificate"
          test "$predecessor_certificate" = "$release_certificate"

      - name: Upload Android release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        uses: actions/upload-artifact@v7
        with:
          name: roveros-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release-predecessor.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Android signing key
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.build_release }}
        run: rm -f "$RUNNER_TEMP/roveros-release.keystore"

  verify-update:
    name: Verify signed update on Android API ${{ matrix.api-level }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]

    steps:
      - name: Download signed Android APK pair
        uses: actions/download-artifact@v7
        with:
          name: roveros-android-release
          path: android-release

      - name: Install and update on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_PREDECESSOR_APK: ${{ github.workspace }}/android-release/app-release-predecessor.apk
          ANDROID_RELEASE_APK: ${{ github.workspace }}/android-release/app-release.apk
          ANDROID_RELEASE_RUN_NUMBER: ${{ github.run_number }}
          EXPECTED_ANDROID_API: ${{ matrix.api-level }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            package_name="com.roverostech.rover"
            data_dir="/sdcard/Android/data/${package_name}/files/update-install-check"
            marker="$data_dir/retained-data.txt"

            actual_api=$(adb shell getprop ro.build.version.sdk | tr -d '\r')
            test "$actual_api" = "$EXPECTED_ANDROID_API"

            adb install "$ANDROID_PREDECESSOR_APK"
            installed_predecessor_code=$(adb shell dumpsys package "$package_name" |
              sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -n 1 | tr -d '\r')
            test "$installed_predecessor_code" = "$ANDROID_RELEASE_RUN_NUMBER"

            adb shell mkdir -p "$data_dir"
            printf 'release-update-data-retained' | adb shell "cat > '$marker'"
            test "$(adb shell cat "$marker" | tr -d '\r')" = "release-update-data-retained"

            adb install -r "$ANDROID_RELEASE_APK"

            installed_version_code=$(adb shell dumpsys package "$package_name" |
              sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -n 1 | tr -d '\r')
            expected_version_code=$((ANDROID_RELEASE_RUN_NUMBER + 1))
            test "$installed_version_code" = "$expected_version_code"
            test "$(adb shell cat "$marker" | tr -d '\r')" = "release-update-data-retained"
            echo "Android API ${EXPECTED_ANDROID_API} accepted the signed update and retained app-specific data."

  publish-release:
    name: Publish signed APK for testers
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
    needs: [build, verify-update]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: android-release-publish
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Download verified Android release APK
        uses: actions/download-artifact@v7
        with:
          name: roveros-android-release
          path: android-release

      - name: Publish signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          latest_release_run=0
          release_tags=$(gh api --paginate "repos/${GH_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')
          while IFS= read -r existing_tag; do
            if [[ "$existing_tag" =~ ^roveros-android-v1\.0\.([0-9]+)$ ]]; then
              release_run=${BASH_REMATCH[1]}
              if (( release_run > latest_release_run )); then
                latest_release_run=$release_run
              fi
            fi
          done <<< "$release_tags"

          if (( GH_RUN_NUMBER <= latest_release_run )); then
            echo "::error::This workflow run would publish Android version 1.0.${GH_RUN_NUMBER}, which is not newer than the latest published Android release 1.0.${latest_release_run}."
            exit 1
          fi

          tag="roveros-android-v1.0.${GH_RUN_NUMBER}"
          version="1.0.${GH_RUN_NUMBER}"
          apk="RoverOS-Android-v${version}.apk"
          cp android-release/app-release.apk "$apk"

          release_url="${GH_SERVER_URL}/${GH_REPOSITORY}/releases/latest"
          gh release create "$tag" "$apk" \
            --title "RoverOS Android Tester Release v${version}" \
            --notes "Signed Android APK for testers. Download the APK from Assets below. Stable download page: ${release_url}" \
            --latest \
            --target "$GH_SHA"

          printf '## RoverOS Android tester release\n\nDownload the latest signed release: [GitHub Releases](%s)\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
